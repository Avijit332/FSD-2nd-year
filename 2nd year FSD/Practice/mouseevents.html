<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            width: 200px;
            height: 200px;
            background-color: red;
            padding: 20px;
            margin: 200px;
            cursor: pointer;
        }
    </style>
    <script>
        function eventcall(){
            alert("you clicked the box");
        }
        function eventcall2(){
            alert("you right-clicked the box");
        }
    </script>
</head>
<body>
    
    <div id="box" oncontextmenu="eventcall3(); return false;">this is a section
    </div>
    <p  onmouseout="eventcall2()">this is a paragraph</p>
</body>
</html>
